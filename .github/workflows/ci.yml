name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Ohne Supabase-Variablen läuft alles im lokalen Modus; Build und Tests brauchen keine .env.
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Nachvollziehbarkeit (zeigt Lücken, blockiert nicht)
        run: make trace
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make coverage
      - run: make build
